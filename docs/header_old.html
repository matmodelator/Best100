<style>

/*
========================================
menu.html separatly | v2.0.0
========================================
*/

/*
========================================
ВЕРХНЯЯ ШАПКА
========================================
*/

.site-header {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 18px;
  padding: 18px;

  background: #1f2933;
  color: white;
}

.header-text {
  display: flex;
  flex-direction: column;
  justify-content: center;

  text-align: left;
}

.site-header h1 {
  margin: 0;

  font-size: 36px;
  line-height: 1;
}

.site-header p {
  margin: 5px 0 0;

  color: #d1d5db;

  font-size: 16px;
  line-height: 1.15;
}

/*
========================================
КОМПАС / ЛОГОТИП
========================================
*/

.compass-nav {
  position: relative;

  width: 120px;

  flex: 0 0 auto;
}

.header-logo {
  display: block;

  width: 100%;
  height: auto;

  user-select: none;
  pointer-events: none;
}

/*
========================================
АКТИВНЫЕ ЗОНЫ КОМПАСА
========================================
*/

.compass-zone {
  position: absolute;

  margin: 0;
  padding: 0;

  background: transparent;
  border: none;
  border-radius: 8px;

  cursor: pointer;

  z-index: 5;
}


/*
Левая стрелка.
*/

.compass-left {
  left: 0;
  top: 33%;

  width: 24%;
  height: 30%;
}


/*
Центральная зона XXI.
*/

.compass-center {
  left: 33%;
  top: 60%;

  width: 34%;
  height: 16%;
}


/*
Правая стрелка.
*/

.compass-right {
  right: 0;
  top: 33%;

  width: 24%;
  height: 30%;
}


/*
Фокус с клавиатуры.
*/

.compass-zone:focus-visible {
  outline:
    1px solid rgba(255, 196, 70, 0.8);
}

/*
========================================
НИЖНЕЕ МЕНЮ
========================================
*/

.site-nav {
  position: relative;

  min-height: 42px;

  padding: 10px 150px;

  background: #111827;

  text-align: center;
}

.site-nav .links {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  gap: 28px;
}

.site-nav .links a {
  margin: 0 14px;

  color: white;

  text-decoration: none;

  font-family: Arial, sans-serif;
}

.site-nav .links a:hover {
  color: #d1d5db;
}

/*
========================================
ОБЩИЙ СТИЛЬ БОКОВЫХ КНОПОК
========================================
*/

.side-menu-btn {
  position: absolute;
  top: 50%;

  transform: translateY(-50%);

  padding: 5px 12px;

  background: #374151;
  color: white;

  border: 1px solid #6b7280;
  border-radius: 6px;

  font-family: Arial, sans-serif;
  font-size: 13px;

  cursor: pointer;
}

.side-menu-btn:hover {
  background: #4b5563;
}

/*
========================================
КНОПКА ЛЕВОЙ ПАНЕЛИ
========================================
*/

.review-btn {
  left: 16px;
}

/*
========================================
КНОПКА ПРАВОЙ ПАНЕЛИ
========================================
*/

.user-btn {
  right: 16px;
}

/*
========================================
ОБЩИЙ СТИЛЬ БОКОВЫХ ПАНЕЛЕЙ
========================================
*/

.side-panel {
  position: fixed;
  top: 0;

  display: flex;
  flex-direction: column;

  width: 360px;
  max-width: 92vw;
  height: 100vh;

  padding: 20px;

  background: white;
  color: #1f1f1f;

  overflow-y: auto;

  transition:
    left 0.25s ease,
    right 0.25s ease;

  z-index: 1000;
}

/*
========================================
ЛЕВАЯ ПАНЕЛЬ

Разбор от ИИ и комментарии.
========================================
*/

.review-panel {
  left: -360px;

  box-shadow:
    4px 0 14px rgba(0, 0, 0, 0.18);
}

.review-panel.open {
  left: 0;
}

/*
========================================
ПРАВАЯ ПАНЕЛЬ

Меню пользователя.
========================================
*/

.user-panel {
  right: -360px;

  box-shadow:
    -4px 0 14px rgba(0, 0, 0, 0.18);
}

.user-panel.open {
  right: 0;
}

/*
========================================
ЗАТЕМНЕНИЕ СТРАНИЦЫ
========================================
*/

.panel-overlay {
  position: fixed;
  inset: 0;

  display: none;

  background: rgba(17, 24, 39, 0.42);

  z-index: 900;
}

.panel-overlay.open {
  display: block;
}

/*
========================================
ШАПКА БОКОВОЙ ПАНЕЛИ
========================================
*/

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  margin-bottom: 16px;
}

.panel-header h2,
.panel-header h3 {
  margin: 0;
}

/*
========================================
КНОПКА ЗАКРЫТИЯ
========================================
*/

.close-btn {
  flex: 0 0 auto;

  padding: 0;

  background: none;
  border: none;

  color: #1f2933;

  font-size: 28px;
  line-height: 1;

  cursor: pointer;
}

.close-btn:hover {
  color: #7c2d12;
}

/*
========================================
МОБИЛЬНАЯ ВЕРСИЯ
========================================
*/

@media (max-width: 1024px) {

  .site-header {
    gap: 8px;

    padding: 4px 10px;
  }

  .compass-nav {
    width: 48px;
  }

  .site-header h1 {
    font-size: 22px;
  }

  .site-header p {
    margin-top: 2px;

    font-size: 11px;
    line-height: 1.1;
  }

  .site-nav {
    padding:
      8px 76px;
  }

  .site-nav .links {
    flex-wrap: wrap;

    gap: 8px;
  }

  .site-nav .links a {
    margin: 0 4px;

    font-size: 12px;
  }

  .side-menu-btn {
    padding: 4px 7px;

    font-size: 11px;
  }

  .review-btn {
    left: 5px;
  }

  .user-btn {
    right: 5px;
  }

  .side-panel {
    width: 320px;
  }

  .review-panel {
    left: -320px;
  }

  .user-panel {
    right: -320px;
  }

}


/*
========================================
ОЧЕНЬ УЗКИЙ ЭКРАН
========================================
*/

@media (max-width: 520px) {

  .site-nav {
    padding:
      8px 62px;
  }

  .site-nav .links {
    gap: 4px;
  }

  .site-nav .links a {
    font-size: 10px;
  }

  .review-btn {
    font-size: 0;
  }

  .review-btn::after {
    content: "Разбор";

    font-size: 11px;
  }

  .side-panel {
    width: 92vw;
  }

  .review-panel {
    left: -92vw;
  }

  .user-panel {
    right: -92vw;
  }

}

</style>
