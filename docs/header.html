<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Рифмы века — Header</title>

<style>

/*
========================================
ВЕРХНЯЯ ШАПКА
========================================
*/

.site-header {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 18px;
  padding: 18px;

  background: #1f2933;
  color: white;
}

.header-text {
  display: flex;
  flex-direction: column;
  justify-content: center;

  text-align: left;
}

.site-header h1 {
  margin: 0;

  font-size: 36px;
  line-height: 1;
}

.site-header p {
  margin: 5px 0 0;

  color: #d1d5db;

  font-size: 16px;
  line-height: 1.15;
}


/*
========================================
КОМПАС / ЛОГОТИП
========================================
*/

.compass-nav {
  position: relative;

  width: 120px;

  flex: 0 0 auto;
}

.header-logo {
  display: block;

  width: 100%;
  height: auto;

  user-select: none;
  pointer-events: none;
}


/*
========================================
АКТИВНЫЕ ЗОНЫ КОМПАСА
========================================
*/

.compass-zone {
  position: absolute;

  margin: 0;
  padding: 0;

  background: transparent;
  border: none;
  border-radius: 8px;

  cursor: pointer;

  z-index: 5;
}


/*
Левая стрелка.
*/

.compass-left {
  left: 0;
  top: 33%;

  width: 24%;
  height: 30%;
}


/*
Центральная зона XXI.
*/

.compass-center {
  left: 33%;
  top: 60%;

  width: 34%;
  height: 16%;
}


/*
Правая стрелка.
*/

.compass-right {
  right: 0;
  top: 33%;

  width: 24%;
  height: 30%;
}


/*
Фокус с клавиатуры.
*/

.compass-zone:focus-visible {
  outline:
    1px solid rgba(255, 196, 70, 0.8);
}


/*
========================================
НИЖНЕЕ МЕНЮ
========================================
*/

.site-nav {
  position: relative;

  min-height: 42px;

  padding: 10px 150px;

  background: #111827;

  text-align: center;
}

.site-nav .links {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  gap: 28px;
}

.site-nav .links a {
  margin: 0 14px;

  color: white;

  text-decoration: none;

  font-family: Arial, sans-serif;
}

.site-nav .links a:hover {
  color: #d1d5db;
}


/*
========================================
ОБЩИЙ СТИЛЬ БОКОВЫХ КНОПОК
========================================
*/

.side-menu-btn {
  position: absolute;
  top: 50%;

  transform: translateY(-50%);

  padding: 5px 12px;

  background: #374151;
  color: white;

  border: 1px solid #6b7280;
  border-radius: 6px;

  font-family: Arial, sans-serif;
  font-size: 13px;

  cursor: pointer;
}

.side-menu-btn:hover {
  background: #4b5563;
}


/*
========================================
КНОПКА ЛЕВОЙ ПАНЕЛИ
========================================
*/

.review-btn {
  left: 16px;
}


/*
========================================
КНОПКА ПРАВОЙ ПАНЕЛИ
========================================
*/

.user-btn {
  right: 16px;
}


/*
========================================
ОБЩИЙ СТИЛЬ БОКОВЫХ ПАНЕЛЕЙ
========================================
*/

.side-panel {
  position: fixed;
  top: 0;

  display: flex;
  flex-direction: column;

  width: 360px;
  max-width: 92vw;
  height: 100vh;

  padding: 20px;

  background: white;
  color: #1f1f1f;

  overflow-y: auto;

  transition:
    left 0.25s ease,
    right 0.25s ease;

  z-index: 1000;
}


/*
========================================
ЛЕВАЯ ПАНЕЛЬ

Разбор от ИИ и комментарии.
========================================
*/

.review-panel {
  left: -360px;

  box-shadow:
    4px 0 14px rgba(0, 0, 0, 0.18);
}

.review-panel.open {
  left: 0;
}


/*
========================================
ПРАВАЯ ПАНЕЛЬ

Меню пользователя.
========================================
*/

.user-panel {
  right: -360px;

  box-shadow:
    -4px 0 14px rgba(0, 0, 0, 0.18);
}

.user-panel.open {
  right: 0;
}


/*
========================================
ЗАТЕМНЕНИЕ СТРАНИЦЫ
========================================
*/

.panel-overlay {
  position: fixed;
  inset: 0;

  display: none;

  background:
    rgba(17, 24, 39, 0.42);

  z-index: 900;
}

.panel-overlay.open {
  display: block;
}


/*
========================================
ШАПКА БОКОВОЙ ПАНЕЛИ
========================================
*/

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  margin-bottom: 16px;
}

.panel-header h2,
.panel-header h3 {
  margin: 0;
}


/*
========================================
КНОПКА ЗАКРЫТИЯ
========================================
*/

.close-btn {
  flex: 0 0 auto;

  padding: 0;

  background: none;
  border: none;

  color: #1f2933;

  font-size: 28px;
  line-height: 1;

  cursor: pointer;
}

.close-btn:hover {
  color: #7c2d12;
}


/*
========================================
СООБЩЕНИЯ ЗАГРУЗКИ КОМПОНЕНТОВ
========================================
*/

.component-loading,
.component-error {
  padding: 12px;

  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 1.4;
}

.component-loading {
  color: #6b7280;
}

.component-error {
  color: #991b1b;
}


/*
========================================
МОБИЛЬНАЯ ВЕРСИЯ
========================================
*/

@media (max-width: 1024px) {

  .site-header {
    gap: 8px;

    padding: 4px 10px;
  }

  .compass-nav {
    width: 48px;
  }

  .site-header h1 {
    font-size: 22px;
  }

  .site-header p {
    margin-top: 2px;

    font-size: 11px;
    line-height: 1.1;
  }

  .site-nav {
    padding:
      8px 76px;
  }

  .site-nav .links {
    flex-wrap: wrap;

    gap: 8px;
  }

  .site-nav .links a {
    margin: 0 4px;

    font-size: 12px;
  }

  .side-menu-btn {
    padding: 4px 7px;

    font-size: 11px;
  }

  .review-btn {
    left: 5px;
  }

  .user-btn {
    right: 5px;
  }

  .side-panel {
    width: 320px;
  }

  .review-panel {
    left: -320px;
  }

  .user-panel {
    right: -320px;
  }

}


/*
========================================
ОЧЕНЬ УЗКИЙ ЭКРАН
========================================
*/

@media (max-width: 520px) {

  .site-nav {
    padding:
      8px 62px;
  }

  .site-nav .links {
    gap: 4px;
  }

  .site-nav .links a {
    font-size: 10px;
  }

  .review-btn {
    font-size: 0;
  }

  .review-btn::after {
    content: "Разбор";

    font-size: 11px;
  }

  .side-panel {
    width: 92vw;
  }

  .review-panel {
    left: -92vw;
  }

  .user-panel {
    right: -92vw;
  }

}

</style>

</head>

<body>


<!-- ========================================
     ВЕРХНЯЯ ПАНЕЛЬ
======================================== -->

<header class="site-header">

  <div class="compass-nav">

    <img
      id="headerLogo"
      class="header-logo"
      src=""
      alt="Рифмы века"
    >


    <!-- Левая стрелка -->

    <button
      id="compassLeft"
      class="compass-zone compass-left"
      type="button"
      aria-label="Назад"
      title="Назад"
    ></button>


    <!-- Центральная зона XXI -->

    <button
      id="compassCenter"
      class="compass-zone compass-center"
      type="button"
      aria-label="Антология XXI"
      title="Антология XXI"
    ></button>


    <!-- Правая стрелка -->

    <button
      id="compassRight"
      class="compass-zone compass-right"
      type="button"
      aria-label="Вперёд"
      title="Вперёд"
    ></button>

  </div>


  <div class="header-text">

    <h1>
      Рифмы века
    </h1>

    <p>
      21 стихотворение русскоязычной поэзии третьего тысячелетия
    </p>

  </div>

</header>


<!-- ========================================
     НИЖНЕЕ МЕНЮ
======================================== -->

<nav class="site-nav">


  <!-- Кнопка левой панели -->

  <button
    id="openReviewPanelButton"
    class="side-menu-btn review-btn"
    type="button"
  >
    Разбор / Комментарии
  </button>


  <!-- Центральные ссылки -->

  <div class="links">

    <a
      id="headerHomeLink"
      href="#"
    >
      Главная
    </a>

    <a
      id="headerTop21Link"
      href="#"
    >
      Антология XXI
    </a>

    <a
      id="headerAuthorsLink"
      href="#"
    >
      Авторы
    </a>

    <a
      id="headerAboutLink"
      href="#"
    >
      О проекте
    </a>

  </div>


  <!-- Кнопка правой панели -->

  <button
    id="openUserPanelButton"
    class="side-menu-btn user-btn"
    type="button"
  >
    Меню
  </button>

</nav>


<!-- ========================================
     ЗАТЕМНЕНИЕ СТРАНИЦЫ
======================================== -->

<div
  id="panelOverlay"
  class="panel-overlay"
></div>


<!-- ========================================
     ЛЕВАЯ ПАНЕЛЬ

     Содержимое загружается из review.html
======================================== -->

<aside
  id="reviewPanel"
  class="side-panel review-panel"
>

  <div class="panel-header">

    <h2>
      Разбор и обсуждение
    </h2>

    <button
      id="closeReviewPanelButton"
      class="close-btn"
      type="button"
      aria-label="Закрыть разбор"
    >
      ×
    </button>

  </div>


  <div
    id="reviewContainer"
    class="component-loading"
  >
    Загрузка...
  </div>

</aside>


<!-- ========================================
     ПРАВАЯ ПАНЕЛЬ

     Содержимое загружается из menu.html
======================================== -->

<aside
  id="userPanel"
  class="side-panel user-panel"
>

  <div class="panel-header">

    <h2>
      Меню пользователя
    </h2>

    <button
      id="closeUserPanelButton"
      class="close-btn"
      type="button"
      aria-label="Закрыть меню"
    >
      ×
    </button>

  </div>


  <div
    id="menuContainer"
    class="component-loading"
  >
    Загрузка...
  </div>

</aside>


<!-- ========================================
     ЛОГИКА ОБЩЕГО HEADER
======================================== -->

<script type="module">

/*
========================================
ЗАГРУЗКА КОМПОНЕНТА

Поддерживает:

— HTML-фрагменты;
— полноценные HTML-документы;
— STYLE внутри компонента;
— обычные SCRIPT;
— SCRIPT TYPE="MODULE";
— внешние SCRIPT SRC.

Скрипты выполняются последовательно.
========================================
*/

async function loadComponent(
  containerId,
  file
) {

  const container =
    document.getElementById(
      containerId
    );


  if (!container) {

    throw new Error(
      "Не найден контейнер: "
      + containerId
    );

  }


  container.classList.add(
    "component-loading"
  );

  container.classList.remove(
    "component-error"
  );

  container.textContent =
    "Загрузка...";


  const response =
    await fetch(file);


  if (!response.ok) {

    throw new Error(
      file
      + ": HTTP "
      + response.status
    );

  }


  const html =
    await response.text();


  const componentDocument =
    new DOMParser()
      .parseFromString(
        html,
        "text/html"
      );


  /*
  Если загружен полноценный HTML-документ,
  берём содержимое BODY.

  Если загружен HTML-фрагмент,
  DOMParser также помещает его в BODY.
  */

  const bodyNodes =
    Array.from(
      componentDocument
        .body
        .childNodes
    );


  /*
  STYLE и LINK STYLESHEET могут находиться
  как в HEAD полноценного документа,
  так и внутри HTML-фрагмента.
  */

  const headStyles =
    Array.from(
      componentDocument
        .head
        .querySelectorAll(
          'style, link[rel="stylesheet"]'
        )
    );


  const bodyStyles =
    Array.from(
      componentDocument
        .body
        .querySelectorAll(
          'style, link[rel="stylesheet"]'
        )
    );


  const allStyles = [
    ...headStyles,
    ...bodyStyles
  ];


  /*
  Скрипты временно исключаем из разметки.

  После вставки HTML они будут созданы
  заново и выполнены.
  */

  const scripts =
    Array.from(
      componentDocument
        .querySelectorAll(
          "script"
        )
    );


  scripts.forEach(
    function (script) {

      script.remove();

    }
  );


  /*
  Стили из BODY тоже извлекаем,
  чтобы не оставлять их внутри панели.
  */

  bodyStyles.forEach(
    function (styleNode) {

      styleNode.remove();

    }
  );


  /*
  Очищаем контейнер и вставляем
  содержимое компонента.
  */

  container.replaceChildren();


  const componentFragment =
    document.createDocumentFragment();


  Array.from(
    componentDocument
      .body
      .childNodes
  )
    .forEach(
      function (node) {

        componentFragment.appendChild(
          document.importNode(
            node,
            true
          )
        );

      }
    );


  container.appendChild(
    componentFragment
  );


  container.classList.remove(
    "component-loading"
  );


  /*
  Подключаем стили компонента.

  Для каждого файла создаётся отдельный
  маркер data-component-style, чтобы
  один и тот же стиль не добавлялся
  повторно.
  */

  const absoluteFileUrl =
    new URL(
      file,
      window.location.href
    ).href;


  allStyles.forEach(
    function (oldStyle) {

      const styleType =
        oldStyle.tagName
          .toLowerCase();


      if (
        styleType === "style"
      ) {

        const styleKey =
          absoluteFileUrl
          + "::inline::"
          + oldStyle.textContent;


        const exists =
          Array.from(
            document.head
              .querySelectorAll(
                "style[data-component-style]"
              )
          )
            .some(
              function (styleElement) {

                return (
                  styleElement.dataset
                    .componentStyle
                  === styleKey
                );

              }
            );


        if (exists) {
          return;
        }


        const newStyle =
          document.createElement(
            "style"
          );


        newStyle.dataset.componentStyle =
          styleKey;


        newStyle.textContent =
          oldStyle.textContent;


        document.head.appendChild(
          newStyle
        );

      }


      if (
        styleType === "link"
      ) {

        const source =
          oldStyle.getAttribute(
            "href"
          );


        if (!source) {
          return;
        }


        const absoluteStyleUrl =
          new URL(
            source,
            absoluteFileUrl
          ).href;


        const exists =
          document.head
            .querySelector(
              'link[data-component-style="'
              + CSS.escape(
                  absoluteStyleUrl
                )
              + '"]'
            );


        if (exists) {
          return;
        }


        const newLink =
          document.createElement(
            "link"
          );


        newLink.rel =
          "stylesheet";


        newLink.href =
          absoluteStyleUrl;


        newLink.dataset.componentStyle =
          absoluteStyleUrl;


        document.head.appendChild(
          newLink
        );

      }

    }
  );


  /*
  Выполняем скрипты компонента
  последовательно.
  */

  for (
    const oldScript
    of scripts
  ) {

    const newScript =
      document.createElement(
        "script"
      );


    Array.from(
      oldScript.attributes
    )
      .forEach(
        function (attribute) {

          if (
            attribute.name === "src"
          ) {

            return;

          }


          newScript.setAttribute(
            attribute.name,
            attribute.value
          );

        }
      );


    const source =
      oldScript.getAttribute(
        "src"
      );


    if (source) {

      newScript.src =
        new URL(
          source,
          absoluteFileUrl
        ).href;

    } else {

      newScript.textContent =
        oldScript.textContent;

    }


    const mustWait =
      Boolean(source)
      ||
      newScript.type === "module";


    let scriptPromise =
      Promise.resolve();


    if (mustWait) {

      scriptPromise =
        new Promise(
          function (
            resolve,
            reject
          ) {

            newScript.addEventListener(
              "load",
              resolve,
              {
                once: true
              }
            );


            newScript.addEventListener(
              "error",
              function () {

                reject(
                  new Error(
                    "Ошибка выполнения script из "
                    + file
                  )
                );

              },
              {
                once: true
              }
            );

          }
        );

    }


    document.body.appendChild(
      newScript
    );


    await scriptPromise;

  }


  /*
  Сообщаем компоненту,
  что его разметка уже находится
  в основном документе.
  */

  document.dispatchEvent(
    new CustomEvent(
      "component-loaded",
      {
        detail: {
          containerId,
          file,
          absoluteFileUrl
        }
      }
    )
  );

}


/*
========================================
ЗАКРЫТИЕ ОБЕИХ ПАНЕЛЕЙ
========================================
*/

function closeAllSidePanels() {

  const reviewPanel =
    document.getElementById(
      "reviewPanel"
    );


  const userPanel =
    document.getElementById(
      "userPanel"
    );


  const panelOverlay =
    document.getElementById(
      "panelOverlay"
    );


  reviewPanel?.classList.remove(
    "open"
  );


  userPanel?.classList.remove(
    "open"
  );


  panelOverlay?.classList.remove(
    "open"
  );

}


/*
========================================
ОТКРЫТИЕ ЛЕВОЙ ПАНЕЛИ
========================================
*/

function openReviewPanel() {

  const reviewPanel =
    document.getElementById(
      "reviewPanel"
    );


  const userPanel =
    document.getElementById(
      "userPanel"
    );


  const panelOverlay =
    document.getElementById(
      "panelOverlay"
    );


  userPanel?.classList.remove(
    "open"
  );


  reviewPanel?.classList.add(
    "open"
  );


  panelOverlay?.classList.add(
    "open"
  );

}


/*
========================================
ОТКРЫТИЕ ПРАВОЙ ПАНЕЛИ
========================================
*/

function openUserPanel() {

  const reviewPanel =
    document.getElementById(
      "reviewPanel"
    );


  const userPanel =
    document.getElementById(
      "userPanel"
    );


  const panelOverlay =
    document.getElementById(
      "panelOverlay"
    );


  reviewPanel?.classList.remove(
    "open"
  );


  userPanel?.classList.add(
    "open"
  );


  panelOverlay?.classList.add(
    "open"
  );

}


/*
========================================
НАСТРОЙКА ССЫЛОК
========================================
*/

function initializeHeaderLinks(
  context
) {

  const headerLogo =
    document.getElementById(
      "headerLogo"
    );


  const headerHomeLink =
    document.getElementById(
      "headerHomeLink"
    );


  const headerTop21Link =
    document.getElementById(
      "headerTop21Link"
    );


  const headerAuthorsLink =
    document.getElementById(
      "headerAuthorsLink"
    );


  const headerAboutLink =
    document.getElementById(
      "headerAboutLink"
    );


  if (headerLogo) {

    headerLogo.src =
      context.logoPath
      || "";

  }


  if (headerHomeLink) {

    headerHomeLink.href =
      context.homePath
      || "#";

  }


  if (headerTop21Link) {

    headerTop21Link.href =
      context.top21Path
      || "#";

  }


  if (headerAuthorsLink) {

    headerAuthorsLink.href =
      context.authorsPath
      || "#";

  }


  if (headerAboutLink) {

    headerAboutLink.href =
      context.aboutPath
      || "#";

  }

}


/*
========================================
НАСТРОЙКА БОКОВЫХ ПАНЕЛЕЙ
========================================
*/

function initializeSidePanels() {

  const openReviewPanelButton =
    document.getElementById(
      "openReviewPanelButton"
    );


  const closeReviewPanelButton =
    document.getElementById(
      "closeReviewPanelButton"
    );


  const openUserPanelButton =
    document.getElementById(
      "openUserPanelButton"
    );


  const closeUserPanelButton =
    document.getElementById(
      "closeUserPanelButton"
    );


  const panelOverlay =
    document.getElementById(
      "panelOverlay"
    );


  openReviewPanelButton
    ?.addEventListener(
      "click",
      openReviewPanel
    );


  closeReviewPanelButton
    ?.addEventListener(
      "click",
      closeAllSidePanels
    );


  openUserPanelButton
    ?.addEventListener(
      "click",
      openUserPanel
    );


  closeUserPanelButton
    ?.addEventListener(
      "click",
      closeAllSidePanels
    );


  panelOverlay
    ?.addEventListener(
      "click",
      closeAllSidePanels
    );


  document.addEventListener(
    "keydown",
    function (event) {

      if (
        event.key === "Escape"
      ) {

        closeAllSidePanels();

      }

    }
  );

}


/*
========================================
НАСТРОЙКА КОМПАСА
========================================
*/

function initializeCompass(
  context
) {

  const compassLeft =
    document.getElementById(
      "compassLeft"
    );


  const compassCenter =
    document.getElementById(
      "compassCenter"
    );


  const compassRight =
    document.getElementById(
      "compassRight"
    );


  /*
  ГЛАВНАЯ СТРАНИЦА.

  ← история назад
  XXI первый стих
  → история вперёд
  */

  if (
    context.pageType === "index"
  ) {

    compassLeft
      ?.addEventListener(
        "click",
        function () {

          history.back();

        }
      );


    compassCenter
      ?.addEventListener(
        "click",
        function () {

          window.location.href =
            context.firstPoemPath
            || "21/poems/poem1.html";

        }
      );


    compassRight
      ?.addEventListener(
        "click",
        function () {

          history.forward();

        }
      );


    return;

  }


  /*
  СТРАНИЦА СТИХОТВОРЕНИЯ.

  ← предыдущий стих
  XXI главная Антология XXI
  → следующий стих
  */

  if (
    context.pageType === "poem"
  ) {

    const poemNumber =
      Number(
        context.poemNumber
      );


    const poemsCount =
      Number(
        context.poemsCount
      )
      || 21;


    const poemsBasePath =
      context.poemsBasePath
      || "";


    const previousNumber =
      poemNumber <= 1
        ? poemsCount
        : poemNumber - 1;


    const nextNumber =
      poemNumber >= poemsCount
        ? 1
        : poemNumber + 1;


    compassLeft
      ?.addEventListener(
        "click",
        function () {

          window.location.href =
            poemsBasePath
            + "poem"
            + previousNumber
            + ".html";

        }
      );


    compassCenter
      ?.addEventListener(
        "click",
        function () {

          window.location.href =
            context.top21Path
            || "../../index.html#top21";

        }
      );


    compassRight
      ?.addEventListener(
        "click",
        function () {

          window.location.href =
            poemsBasePath
            + "poem"
            + nextNumber
            + ".html";

        }
      );


    return;

  }


  /*
  РЕЗЕРВНЫЙ РЕЖИМ.

  Если тип страницы не передан,
  используются история браузера
  и ссылка на Антологию XXI.
  */

  compassLeft
    ?.addEventListener(
      "click",
      function () {

        history.back();

      }
    );


  compassCenter
    ?.addEventListener(
      "click",
      function () {

        window.location.href =
          context.top21Path
          || "#";

      }
    );


  compassRight
    ?.addEventListener(
      "click",
      function () {

        history.forward();

      }
    );

}


/*
========================================
ОШИБКА ЗАГРУЗКИ КОМПОНЕНТА
========================================
*/

function showComponentError(
  containerId,
  message
) {

  const container =
    document.getElementById(
      containerId
    );


  if (!container) {
    return;
  }


  container.classList.remove(
    "component-loading"
  );


  container.classList.add(
    "component-error"
  );


  container.textContent =
    message;

}


/*
========================================
ИНИЦИАЛИЗАЦИЯ HEADER
========================================
*/

async function initializeHeader(
  context = {}
) {

  initializeHeaderLinks(
    context
  );


  initializeSidePanels();


  initializeCompass(
    context
  );


  /*
  Левая и правая панели загружаются
  независимо.

  Ошибка одного компонента не должна
  блокировать второй компонент.
  */

  const componentResults =
    await Promise.allSettled([

      loadComponent(
        "reviewContainer",
        context.reviewPath
        || "review.html"
      ),

      loadComponent(
        "menuContainer",
        context.menuPath
        || "menu.html"
      )

    ]);


  if (
    componentResults[0].status
    === "rejected"
  ) {

    console.error(
      "Ошибка загрузки review.html:",
      componentResults[0].reason
    );


    showComponentError(
      "reviewContainer",
      "Не удалось загрузить разбор."
    );

  }


  if (
    componentResults[1].status
    === "rejected"
  ) {

    console.error(
      "Ошибка загрузки menu.html:",
      componentResults[1].reason
    );


    showComponentError(
      "menuContainer",
      "Не удалось загрузить меню."
    );

  }


  /*
  Сообщаем основной странице,
  что header и обе панели
  завершили инициализацию.
  */

  document.dispatchEvent(
    new CustomEvent(
      "header-initialized",
      {
        detail: {
          context,
          reviewLoaded:
            componentResults[0].status
            === "fulfilled",
          menuLoaded:
            componentResults[1].status
            === "fulfilled"
        }
      }
    )
  );

}


/*
========================================
ЭКСПОРТ ФУНКЦИЙ HEADER
========================================
*/

window.loadComponent =
  loadComponent;


window.initializeHeader =
  initializeHeader;


window.closeAllSidePanels =
  closeAllSidePanels;

</script>

<div
  class="row"
  id="build-down"
>
  deploy: --
</div>


<script>

(function () {

  const now =
    new Date();


  const pad =
    number =>
      String(number)
        .padStart(
          2,
          "0"
        );


  const date =
      pad(
        now.getDate()
      )
    + "."
    + pad(
        now.getMonth() + 1
      )
    + "."
    + now.getFullYear();


  const time =
      pad(
        now.getHours()
      )
    + ":"
    + pad(
        now.getMinutes()
      );


  document
    .getElementById(
      "build-down"
    )
    .textContent =
      "deploy: "
      + date
      + " "
      + time;

})();

</script>
