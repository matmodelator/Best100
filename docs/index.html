<title>Рифмы века — top21</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  flex-direction: column;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  background: #f4efe7;
  color: #1f1f1f;
}

.container {
  width: 100%;
  max-width: 1160px;

  margin: 0 auto;
  padding: 10px 18px;

  flex: 1;

  display: flex;
  flex-direction: column;

  overflow: hidden;
}

.section-title {
  margin: 0 0 8px;

  font-size: 26px;
}

.controls {
  margin-bottom: 8px;
}

.controls input {
  width: 100%;

  padding: 8px;

  font-size: 14px;

  border: 1px solid #c7c7c7;
  border-radius: 8px;
}

.top-grid {
  flex: 1;
  min-height: 0;

  display: grid;

  grid-template-columns:
    repeat(7, 1fr);

  grid-template-rows:
    repeat(3, 1fr);

  gap: 6px;
}

.poem-card {
  padding: 6px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  overflow: hidden;

  background: white;

  border-radius: 8px;

  box-shadow:
    0 2px 5px rgba(0, 0, 0, 0.08);

  cursor: pointer;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease;
}

.poem-card:hover {
  transform: translateY(-2px);

  box-shadow:
    0 6px 14px rgba(0, 0, 0, 0.18);
}

.poem-card h3 {
  margin: 0 0 3px;

  font-size: 12px;
  line-height: 1.1;
}

.poem-info {
  flex-shrink: 0;
}

.poem-photo {
  display: block;

  width: 100%;
  height: auto;
  max-height: 120px;

  margin-bottom: 5px;

  object-fit: contain;

  border-radius: 6px;

  flex-shrink: 0;
}

.author {
  margin: 3px 0;

  color: #7c2d12;

  font-size: 12px;
  font-weight: bold;
}

.excerpt {
  overflow: hidden;

  white-space: pre-line;

  font-size: 11px;
  line-height: 1.15;
}

.meta {
  margin-top: 4px;

  color: #777;

  font-size: 10px;
}

.loading-card {
  min-height: 120px;

  background:
    rgba(255, 255, 255, 0.55);

  border-radius: 8px;
}

footer {
  margin-top: 0;
  padding: 12px;

  background: #1f2933;
  color: #d1d5db;

  text-align: center;

  font-family: Arial, sans-serif;
}

@media (max-width: 1024px) {

  .top-grid {
    grid-template-columns:
      repeat(3, 1fr);

    grid-template-rows:
      repeat(7, 1fr);
  }

  .poem-card {
    padding: 5px;
  }

  .poem-card h3 {
    font-size: 12px;
  }

  .poem-photo {
    height: 40px;
  }

  .author {
    font-size: 11px;
  }

  .excerpt {
    font-size: 10px;
  }

  .meta {
    font-size: 9px;
  }

}

</style>

</head>

<!-- ========================================
     ОСНОВНОЙ КОНТЕЙНЕР
======================================== -->

<main class="container">

  <h2

    Антология XXI
  </h2>


  <div class="controls">

    id="topGrid"
  ></div>

</main>


<!-- ========================================

<footer>
  Рифмы века © 2026
</footer>


<!-- ========================================
     ЗАГРУЗКА HTML-КОМПОНЕНТОВ

     Загружает HTML-файл в контейнер.

     В отличие от обычного innerHTML:
     скрипты из загруженного компонента
     создаются заново и выполняются.
======================================== -->

<script>

async function loadHtmlComponent(
  container,
  componentPath
) {

  const response =
    await fetch(componentPath);

  if (!response.ok) {

    throw new Error(
      componentPath
      + ": HTTP "
      + response.status
    );

  }

  const html =
    await response.text();


  /*
  Вставляем HTML и CSS компонента.
  */

  container.innerHTML =
    html;


  /*
  Скрипты, вставленные через innerHTML,
  браузер не выполняет.

  Поэтому каждый script заменяется
  новым исполняемым элементом.
  */

  const inactiveScripts =
    Array.from(
      container.querySelectorAll(
        "script"
      )
    );


  for (
    const inactiveScript
    of inactiveScripts
  ) {

    const activeScript =
      document.createElement(
        "script"
      );


    for (
      const attribute
      of inactiveScript.attributes
    ) {

      activeScript.setAttribute(
        attribute.name,
        attribute.value
      );

    }


    if (
      inactiveScript.src
    ) {

      activeScript.src =
        new URL(
          inactiveScript.getAttribute(
            "src"
          ),
          new URL(
            componentPath,
            window.location.href
          )
        ).href;

    } else {

      activeScript.textContent =
        inactiveScript.textContent;

    }


    const waitsForLoad =
      Boolean(activeScript.src)
      ||
      activeScript.type ===
        "module";


    let executionPromise =
      Promise.resolve();


    if (waitsForLoad) {

      executionPromise =
        new Promise(
          function (
            resolve,
            reject
          ) {

            activeScript.addEventListener(
              "load",
              resolve,
              {
                once: true
              }
            );

            activeScript.addEventListener(
              "error",
              function () {

                reject(
                  new Error(
                    "Не удалось выполнить script из "
                    + componentPath
                  )
                );

              },
              {
                once: true
              }
            );

          }
        );

    }


    inactiveScript.replaceWith(
      activeScript
    );


    await executionPromise;

  }

}

</script>


<!-- ========================================
     СТИХОТВОРЕНИЯ АНТОЛОГИИ
======================================== -->

<script>

const poemPages = [

  "21/poems/poem1.html",
  "21/poems/poem2.html",
  "21/poems/poem3.html",
  "21/poems/poem4.html",
  "21/poems/poem5.html",
  "21/poems/poem6.html",
  "21/poems/poem7.html",
  "21/poems/poem8.html",
  "21/poems/poem9.html",
  "21/poems/poem10.html",
  "21/poems/poem11.html",
  "21/poems/poem12.html",
  "21/poems/poem13.html",
  "21/poems/poem14.html",
  "21/poems/poem15.html",
  "21/poems/poem16.html",
  "21/poems/poem17.html",
  "21/poems/poem18.html",
  "21/poems/poem19.html",
  "21/poems/poem20.html",
  "21/poems/poem21.html"

];


/*
Кэш загруженных данных.

При каждом символе поиска
21 HTML-файл повторно не загружается.
*/

let loadedPoemsPromise =
  null;


/*
========================================
ЗАГРУЗКА ОДНОГО СТИХОТВОРЕНИЯ
========================================
*/

async function loadPoem(
  page
) {

  const response =
    await fetch(page);


  if (!response.ok) {

    throw new Error(
      page
      + ": HTTP "
      + response.status
    );

  }


  const html =
    await response.text();


  const documentFragment =
    new DOMParser()
      .parseFromString(
        html,
        "text/html"
      );


  const imageElement =
    documentFragment.querySelector(
      ".photo img"
    );


  const imageSource =
    imageElement
      ?.getAttribute("src")
    || "";


  const image =
    imageSource
      ? new URL(
          imageSource,
          new URL(
            page,
            window.location.href
          )
        ).href
      : "";


  return {

    page,

    title:
      documentFragment
        .querySelector(".title")
        ?.textContent
        .trim()
      || "",

    author:
      documentFragment
        .querySelector(".author")
        ?.textContent
        .trim()
      || "",

    year:
      documentFragment
        .querySelector(".year")
        ?.textContent
        .trim()
      || "",

    excerpt:
      documentFragment
        .querySelector(".excerpt")
        ?.textContent
        .trim()
      || "",

    image

  };

}


/*
========================================
ЗАГРУЗКА ВСЕХ СТИХОТВОРЕНИЙ
========================================
*/

function getLoadedPoems() {

  if (!loadedPoemsPromise) {

    loadedPoemsPromise =
      Promise.all(
        poemPages.map(
          loadPoem
        )
      );

  }

  return loadedPoemsPromise;

}


/*
========================================
КАРТОЧКА СТИХОТВОРЕНИЯ
========================================
*/

function createCard(
  poem
) {

  const card =
    document.createElement(
      "article"
    );


  card.className =
    "poem-card";


  card.title =
    "Открыть стихотворение";


  if (poem.image) {

    const image =
      document.createElement(
        "img"
      );

    image.className =
      "poem-photo";

    image.src =
      poem.image;

    image.alt =
      "";

    card.appendChild(
      image
    );

  }


  const poemInfo =
    document.createElement(
      "div"
    );

  poemInfo.className =
    "poem-info";


  const title =
    document.createElement(
      "h3"
    );

  title.textContent =
    poem.title;


  const author =
    document.createElement(
      "div"
    );

  author.className =
    "author";

  author.textContent =
    poem.author;


  const excerpt =
    document.createElement(
      "div"
    );

  excerpt.className =
    "excerpt";

  excerpt.textContent =
    poem.excerpt;


  const meta =
    document.createElement(
      "div"
    );

  meta.className =
    "meta";

  meta.textContent =
    poem.year;


  poemInfo.append(
    title,
    author,
    excerpt,
    meta
  );


  card.appendChild(
    poemInfo
  );


  card.addEventListener(
    "click",
    function () {

      window.location.href =
        poem.page;

    }
  );


  return card;

}


/*
========================================
ЗАГЛУШКИ ДО ЗАГРУЗКИ КАРТОЧЕК
========================================
*/

function renderLoadingCards() {

  const topGrid =
    document.getElementById(
      "topGrid"
    );


  topGrid.replaceChildren();


  for (
    let index = 0;
    index < 21;
    index++
  ) {

    const loadingCard =
      document.createElement(
        "div"
      );

    loadingCard.className =
      "loading-card";

    topGrid.appendChild(
      loadingCard
    );

  }

}


/*
========================================
ОТРИСОВКА АНТОЛОГИИ
========================================
*/

async function renderTop21() {

  const topGrid =
    document.getElementById(
      "topGrid"
    );


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  try {

    const loadedPoems =
      await getLoadedPoems();


    const filteredPoems =
      loadedPoems.filter(
        function (poem) {

          return (
            poem.title
              .toLowerCase()
              .includes(search)
            ||
            poem.author
              .toLowerCase()
              .includes(search)
          );

        }
      );


    const fragment =
      document.createDocumentFragment();


    filteredPoems.forEach(
      function (poem) {

        fragment.appendChild(
          createCard(poem)
        );

      }
    );


    topGrid.replaceChildren(
      fragment
    );

  } catch (error) {

    console.error(
      "Ошибка загрузки стихотворений:",
      error
    );


    topGrid.textContent =
      "Не удалось загрузить Антологию XXI.";

  }

}


/*
========================================
ПОИСК
========================================
*/

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    renderTop21
  );


renderLoadingCards();
renderTop21();

</script>

<!-- ========================================
     ЗАГРУЗКА ОБЩЕГО HEADER

     index.html загружает только header.html.

     Затем header.html самостоятельно:
     — инициализирует свою разметку;
     — загружает review.html;
     — загружает menu.html;
     — запускает их скрипты.
======================================== -->

<script>

async function loadHeader() {

  const headerContainer =
    document.getElementById(
      "headerContainer"
    );


  try {

    await loadHtmlComponent(
      headerContainer,
      "header.html"
    );


    /*
    Header может экспортировать функцию
    дополнительной инициализации.

    Если она существует, передаём ей
    контекст текущей страницы.
    */

    if (
      typeof window.initializeHeader
      === "function"
    ) {

      await window.initializeHeader(
        window.headerPageContext
      );

    }


    document.dispatchEvent(
      new CustomEvent(
        "header-loaded",
        {
          detail:
            window.headerPageContext
        }
      )
    );

  } catch (error) {

    console.error(
      "Ошибка загрузки header.html:",
      error
    );


    headerContainer.textContent =
      "Не удалось загрузить верхнюю панель.";

  }

}


loadHeader();

</script>

<div id="service-console">

<div
  class="row"
  id="build-down"
>
  deploy: --
</div>


<script>

(function () {

  const now =
    new Date();


  const pad =
    number =>
      String(number)
        .padStart(
          2,
          "0"
        );


  const date =
      pad(
        now.getDate()
      )
    + "."
    + pad(
        now.getMonth() + 1
      )
    + "."
    + now.getFullYear();


  const time =
      pad(
        now.getHours()
      )
    + ":"
    + pad(
        now.getMinutes()
      );


  document
    .getElementById(
      "build-down"
    )
    .textContent =
      "deploy: "
      + date
      + " "
      + time;

})();

</script>
