<!DOCTYPE html>
<html lang="ru">
<head>

  <!-- ========================================
       META
  ======================================== -->

  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <title>Вход / Регистрация</title>

  <!-- ========================================
       СТИЛЬ СЕРВИСНОЙ КОНСОЛИ
  ======================================== 

  <link rel="stylesheet"
        href="styles/console.css" /> -->
  
<style>

/* ========================================
   ОБЩАЯ РАЗМЕТКА
======================================== */

*{
  box-sizing:border-box;
}

html,
body{
  min-height:100%;
}

body{
  margin:0;

  font-family:Georgia,"Times New Roman",serif;

  background:#f4efe7;
  color:#1f1f1f;
}


/* ========================================
   ВЕРХНЯЯ КОРИЧНЕВАЯ ПЛАШКА
======================================== */

header{
  background:#7c2d12;
  color:#fff;

  padding:14px 20px;

  text-align:center;

  box-shadow:0 2px 8px rgba(0,0,0,.16);
}

header h1{
  margin:0;

  font-size:28px;
  font-weight:normal;
  letter-spacing:.4px;
}


/* ========================================
   ОКНО ВХОДА / РЕГИСТРАЦИИ
======================================== */

.container{
  width:calc(100% - 32px);
  max-width:460px;

  margin:36px auto;

  padding:28px;

  background:#fffdf8;

  border:1px solid #d5c7b3;
  border-radius:12px;

  box-shadow:0 8px 24px rgba(58,40,24,.14);
}

h2{
  margin:0 0 24px;

  text-align:center;

  font-size:26px;
  font-weight:normal;

  color:#5e2412;
}


/* ========================================
   ПОДПИСИ К ПОЛЯМ
======================================== */

label{
  display:block;

  margin:0 0 6px;

  font-size:15px;
  font-weight:bold;

  color:#382b23;
}


/* ========================================
   ПОЛЯ ВВОДА
======================================== */

input{
  display:block;

  width:100%;

  margin:0 0 16px;
  padding:11px 12px;

  border:1px solid #cbbba5;
  border-radius:7px;

  background:#fff;

  color:#1f1f1f;

  font-family:Arial,sans-serif;
  font-size:16px;
}

input:focus{
  outline:none;

  border-color:#7c2d12;

  box-shadow:0 0 0 3px rgba(124,45,18,.12);
}

input::placeholder{
  color:#92877c;
}


/* ========================================
   ПАРОЛЬ И КНОПКА-ГЛАЗ
======================================== */

.password-wrapper{
  position:relative;

  margin-bottom:16px;
}

.password-wrapper input{
  margin-bottom:0;

  padding-right:46px;
}

.eye-btn{
  position:absolute;

  top:50%;
  right:8px;

  width:34px;
  height:34px;

  padding:0;

  transform:translateY(-50%);

  border:0;
  border-radius:50%;

  background:transparent;
  color:#5e2412;

  font-size:17px;
  line-height:34px;

  cursor:pointer;
}

.eye-btn:hover{
  background:rgba(124,45,18,.08);
}


/* ========================================
   ОСНОВНЫЕ КНОПКИ
======================================== */

.buttons{
  display:flex;

  gap:12px;

  margin-top:22px;
}

.login-btn,
.signup-btn{
  flex:1;

  min-height:44px;

  padding:11px 14px;

  border:1px solid #7c2d12;
  border-radius:8px;

  background:#7c2d12;
  color:#fff;

  font-family:Georgia,"Times New Roman",serif;
  font-size:16px;
  font-weight:bold;

  cursor:pointer;

  transition:
    background .15s ease,
    transform .15s ease;
}

.login-btn:hover,
.signup-btn:hover{
  background:#65220d;
}

.login-btn:active,
.signup-btn:active{
  transform:translateY(1px);
}


/* ========================================
   СТАТУС / ОШИБКИ
======================================== */

#status{
  min-height:24px;

  margin:18px 0 0;

  text-align:center;

  font-family:Arial,sans-serif;
  font-size:14px;
  font-weight:bold;
  line-height:1.45;

  color:#7c2d12;
}


/* ========================================
   ВОССТАНОВЛЕНИЕ ПАРОЛЯ
======================================== */

.recovery-link{
  display:block;

  margin-top:16px;

  text-align:center;

  color:#7c2d12;

  font-family:Arial,sans-serif;
  font-size:14px;

  text-decoration:none;
}

.recovery-link:hover{
  text-decoration:underline;
}


/* ========================================
   УБРАТЬ ВСТРОЕННЫЙ ГЛАЗ БРАУЗЕРА
======================================== */

input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear{
  display:none;
}

input[type="password"]::-webkit-credentials-auto-fill-button{
  display:none !important;
}

input[type="password"]::-webkit-textfield-decoration-container{
  display:none !important;
}


/* ========================================
   МОБИЛЬНАЯ ВЕРСИЯ
======================================== */

@media(max-width:520px){

  header{
    padding:12px 16px;
  }

  header h1{
    font-size:24px;
  }

  .container{
    width:calc(100% - 20px);

    margin:18px auto;

    padding:22px 18px;
  }

  h2{
    font-size:23px;
  }

  .buttons{
    flex-direction:column;
  }

}

</style>
  
</head>

<body>

<!-- ========================================
     ШАПКА
======================================== -->

<header>
  <h1>Рифмы века</h1>
</header>

<!-- ========================================
     ОСНОВНОЙ БЛОК
======================================== -->

<div class="container">

  <h2>Вход / Регистрация</h2>

  <!-- ========================================
     ФОРМА АУТЕНТИФИКАЦИИ
======================================== -->

<form id="authForm">

  <!-- EMAIL -->

  <label>Email:</label>

  <input
    id="email"
    type="email"
    required
  />

 <!-- NAME -->

<label for="name">
  Имя (литературный псевдоним):
</label>

<input
  id="name"
  type="text"
  maxlength="80"
  autocomplete="nickname"
  placeholder="Обязательно для регистрации"
/>
  
  </div>

  <!-- PASSWORD -->

  <label>Password:</label>

  <div class="password-wrapper">

    <input
      id="password"
      type="password"
      required
      minlength="6"
    />

    <button
      type="button"
      class="eye-btn"
      onclick="togglePassword('password', this)"
    >
      👁
    </button>

  </div>

    <!-- CONFIRM PASSWORD -->

    <label>Confirm password:</label>

    <div class="password-wrapper">

      <input
        id="confirmPassword"
        type="password"
        minlength="6"
        placeholder="Только при регистрации"
      />

      <button
        type="button"
        class="eye-btn"
        onclick="togglePassword('confirmPassword', this)"
      >
        👁
      </button>

    </div>

    <!-- КНОПКИ -->

    <div class="buttons">

      <button
        type="button"
        class="login-btn"
        onclick="login()"
      >
        Вход
      </button>

      <button
        type="button"
        class="signup-btn"
        onclick="signup()"
      >
        Регистрация
      </button>

    </div>

  </form>

  <!-- ========================================
       СТАТУС
  ======================================== -->

  <p id="status"></p>

  <!-- ========================================
       ВОССТАНОВЛЕНИЕ ПАРОЛЯ
  ======================================== -->

  <a
    href="re-pass.html"
    class="recovery-link"
  >
    Забыли пароль? Восстановить доступ.
  </a>

</div>

<!-- ========================================
     ЛОГИКА АУТЕНТИФИКАЦИИ
======================================== -->

<script type="module">

  import { supabase }
  from './supabase-config.js'

  /* ========================================
     ПОЛЯ
  ======================================== */

  const emailInput =
  document.getElementById('email')

const nameInput =
  document.getElementById('name')

const passwordInput =
  document.getElementById('password')

  const confirmPasswordInput =
    document.getElementById('confirmPassword')

  const statusText =
    document.getElementById('status')

  /* ========================================
     ПОКАЗ / СКРЫТИЕ ПАРОЛЯ
  ======================================== */

  function togglePassword(id, btn) {

    const field =
      document.getElementById(id)

    if (field.type === 'password') {

      field.type =
        'text'

      btn.textContent =
        '🙈'

    }
    else {

      field.type =
        'password'

      btn.textContent =
        '👁'

    }

  }

  window.togglePassword =
    togglePassword 

  /* ========================================
     ВХОД
  ======================================== */

  async function login() {

    const email =
      emailInput.value.trim()

    const password =
      passwordInput.value

    statusText.textContent =
      'Выполняется вход...'

    const { error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      })

    if (error) {

      if (
        error.message &&
        error.message.includes(
          'Email not confirmed'
        )
      ) {

        statusText.textContent =
          'Почта не подтверждена'

        setTimeout(function () {

          window.location.href =
            'check-email.html'

        }, 500)

        return
      }

      statusText.textContent =
        'Ошибка: ' + error.message

      return
    }

    statusText.textContent =
      'Успешный вход'

    setTimeout(function () {

      window.location.href =
        'check-account.html'

    }, 300)
  }

  window.login =
    login

  /* ========================================
     РЕГИСТРАЦИЯ
  ======================================== */

  async function signup() {

  const name =
    nameInput.value.trim()

  const email =
    emailInput.value.trim()

  const password =
    passwordInput.value

  const confirmPassword =
    confirmPasswordInput.value.trim()


  /*
  Имя обязательно только при регистрации.
  При входе поле не проверяется.
  */

  if (!name) {

    statusText.textContent =
      'Введите имя или литературный псевдоним'

    nameInput.focus()

    return
  }


  if (!email) {

    statusText.textContent =
      'Введите Email'

    emailInput.focus()

    return
  }


  if (!password) {

    statusText.textContent =
      'Введите Password'

    passwordInput.focus()

    return
  }


  if (!confirmPassword) {

    statusText.textContent =
      'Заполните Confirm password'

    confirmPasswordInput.focus()

    return
  }


  if (password !== confirmPassword) {

    statusText.textContent =
      'Пароли не совпадают'

    confirmPasswordInput.focus()

    return
  }


  statusText.textContent =
    'Регистрация...'


  /*
  Имя сохраняется в metadata пользователя Supabase.

  После подтверждения почты check-account.html
  сможет получить его через:

  user.user_metadata.name
  */

  const { error } =
    await supabase.auth.signUp({

      email,
      password,

      options: {

        data: {
          name: name
        },

        emailRedirectTo:
          'https://matmodelator.github.io/Best100/confirm.html'

      }

    })


  if (error) {

    statusText.textContent =
      'Ошибка: ' + error.message

    return
  }


  statusText.textContent =
    'Письмо отправлено. Проверь почту.'


  setTimeout(function () {

    window.location.href =
      'check-email.html'

  }, 800)

}

window.signup =
  signup

</script>



<!-- ========================================
     SERVICE CONSOLE
======================================== -->

<div id="service-console">
new style | v1.1.2
</div>

<div class="row" id="build-down">
deploy: --
</div>

<script>
(function () {
  const now = new Date();

  const pad = n =>
    String(n).padStart(2, "0");

  const date =
      pad(now.getDate())
    + "."
    + pad(now.getMonth() + 1)
    + "."
    + now.getFullYear();

  const time =
      pad(now.getHours())
    + ":"
    + pad(now.getMinutes());

  document
    .getElementById("build-down")
    .textContent =
      "deploy: "
      + date
      + " "
      + time;
})();
</script>


</body>
</html>
