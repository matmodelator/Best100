<!DOCTYPE html>
<html lang="ru">
<head>

  <!-- ========================================
       META
  ======================================== -->

  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <title>Вход / Регистрация</title>

  <!-- ========================================
       СТИЛЬ СЕРВИСНОЙ КОНСОЛИ
  ======================================== 

  <link rel="stylesheet"
        href="styles/console.css" /> -->
  
  <style>

   /* ========================================
   БАЗОВАЯ СТРАНИЦА
======================================== */

body{

    margin:0;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Georgia,"Times New Roman",serif;

    background:#f4efe7;
    color:#1f1f1f;
}

/* ========================================
   ШАПКА НЕ НУЖНА
======================================== */

header{

    display:none;

}

/* ========================================
   ОСНОВНОЕ ОКНО
======================================== */

.container{

    width:min(520px,92vw);

    background:#fffdf8;

    border:1px solid #d8cbb5;
    border-radius:14px;

    padding:36px;

    box-shadow:0 10px 28px rgba(0,0,0,.12);

    text-align:left;

}

/* ========================================
   ЗАГОЛОВОК
======================================== */

h2{

    margin:0 0 26px;

    text-align:center;

    font-size:30px;

    color:#5b4325;

}

/* ========================================
   ПОДПИСИ К ПОЛЯМ
======================================== */

label{

    display:block;

    margin:0 0 6px;

    font-weight:bold;

}

/* ========================================
   ПОЛЯ ВВОДА
======================================== */

input{

    width:100%;

    padding:12px;

    margin-bottom:16px;

    box-sizing:border-box;

    border:1px solid #cdbda5;
    border-radius:8px;

    background:#fff;

    font-size:16px;

    font-family:inherit;

}

/* ========================================
   АКТИВНОЕ ПОЛЕ
======================================== */

input:focus{

    outline:none;

    border-color:#8b5e34;

    box-shadow:0 0 0 3px rgba(139,94,52,.15);

}

/* ========================================
   ПАРОЛЬ + КНОПКА ГЛАЗА
======================================== */

.password-wrapper{

    position:relative;

    margin-bottom:16px;

}

.eye-btn{

    position:absolute;

    right:10px;
    top:50%;

    transform:translateY(-50%);

    border:none;

    background:none;

    cursor:pointer;

    font-size:18px;

}

/* ========================================
   БЛОК КНОПОК
======================================== */

.buttons{

    display:flex;

    gap:12px;

    margin-top:10px;

}

/* ========================================
   ВСЕ КНОПКИ
======================================== */

button{

    flex:1;

    padding:12px;

    border:none;
    border-radius:8px;

    background:#8b5e34;

    color:#fff;

    font-size:16px;

    font-family:inherit;

    cursor:pointer;

    transition:.2s;

}

/* ========================================
   НАВЕДЕНИЕ
======================================== */

button:hover{

    background:#6f4927;

}

/* ========================================
   НАЖАТИЕ
======================================== */

button:active{

    transform:scale(.98);

}

/* ========================================
   ОБЕ КНОПКИ В ОДНОМ СТИЛЕ
======================================== */

.login-btn,
.signup-btn{

    background:#8b5e34;

}

.login-btn:hover,
.signup-btn:hover{

    background:#6f4927;

}

/* ========================================
   СТРОКА СООБЩЕНИЙ
======================================== */

#status{

    min-height:24px;

    margin-top:20px;

    text-align:center;

    font-weight:bold;

    color:#5b4325;

}

/* ========================================
   ССЫЛКА ВОССТАНОВЛЕНИЯ ПАРОЛЯ
======================================== */

.recovery-link{

    display:block;

    margin-top:18px;

    text-align:center;

    color:#8b5e34;

    text-decoration:none;

}

.recovery-link:hover{

    text-decoration:underline;

}

/* ========================================
   УБРАТЬ ВСТРОЕННЫЙ ГЛАЗ БРАУЗЕРА
======================================== */

input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear{

    display:none;

}

input[type="password"]::-webkit-credentials-auto-fill-button{

    display:none !important;

}

input[type="password"]::-webkit-textfield-decoration-container{

    display:none !important;

}
    
  </style>
</head>

<body>

<!-- ========================================
     ШАПКА
======================================== -->

<header>
  <h1>Рифмы века</h1>
</header>

<!-- ========================================
     ОСНОВНОЙ БЛОК
======================================== -->

<div class="container">

  <h2>Вход / Регистрация</h2>

  <!-- ========================================
     ФОРМА АУТЕНТИФИКАЦИИ
======================================== -->

<form id="authForm">

  <!-- EMAIL -->

  <label>Email:</label>

  <input
    id="email"
    type="email"
    required
  />

 <!-- NAME -->

<label for="name">
  Имя (литературный псевдоним):
</label>

<input
  id="name"
  type="text"
  maxlength="80"
  autocomplete="nickname"
  placeholder="Обязательно для регистрации"
/>
  
  </div>

  <!-- PASSWORD -->

  <label>Password:</label>

  <div class="password-wrapper">

    <input
      id="password"
      type="password"
      required
      minlength="6"
    />

    <button
      type="button"
      class="eye-btn"
      onclick="togglePassword('password', this)"
    >
      👁
    </button>

  </div>

    <!-- CONFIRM PASSWORD -->

    <label>Confirm password:</label>

    <div class="password-wrapper">

      <input
        id="confirmPassword"
        type="password"
        minlength="6"
        placeholder="Only for sign up"
      />

      <button
        type="button"
        class="eye-btn"
        onclick="togglePassword('confirmPassword', this)"
      >
        👁
      </button>

    </div>

    <!-- КНОПКИ -->

    <div class="buttons">

      <button
        type="button"
        class="login-btn"
        onclick="login()"
      >
        Log in
      </button>

      <button
        type="button"
        class="signup-btn"
        onclick="signup()"
      >
        Sign up
      </button>

    </div>

  </form>

  <!-- ========================================
       СТАТУС
  ======================================== -->

  <p id="status"></p>

  <!-- ========================================
       ВОССТАНОВЛЕНИЕ ПАРОЛЯ
  ======================================== -->

  <a
    href="re-pass.html"
    class="recovery-link"
  >
    Забыли пароль? Восстановить доступ.
  </a>

</div>

<!-- ========================================
     ЛОГИКА АУТЕНТИФИКАЦИИ
======================================== -->

<script type="module">

  import { supabase }
  from './supabase-config.js'

  /* ========================================
     ПОЛЯ
  ======================================== */

  const emailInput =
  document.getElementById('email')

const nameInput =
  document.getElementById('name')

const passwordInput =
  document.getElementById('password')

  const confirmPasswordInput =
    document.getElementById('confirmPassword')

  const statusText =
    document.getElementById('status')

  /* ========================================
     ПОКАЗ / СКРЫТИЕ ПАРОЛЯ
  ======================================== */

  function togglePassword(id, btn) {

    const field =
      document.getElementById(id)

    if (field.type === 'password') {

      field.type =
        'text'

      btn.textContent =
        '🙈'

    }
    else {

      field.type =
        'password'

      btn.textContent =
        '👁'

    }

  }

  window.togglePassword =
    togglePassword 

  /* ========================================
     ВХОД
  ======================================== */

  async function login() {

    const email =
      emailInput.value.trim()

    const password =
      passwordInput.value

    statusText.textContent =
      'Выполняется вход...'

    const { error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      })

    if (error) {

      if (
        error.message &&
        error.message.includes(
          'Email not confirmed'
        )
      ) {

        statusText.textContent =
          'Почта не подтверждена'

        setTimeout(function () {

          window.location.href =
            'check-email.html'

        }, 500)

        return
      }

      statusText.textContent =
        'Ошибка: ' + error.message

      return
    }

    statusText.textContent =
      'Успешный вход'

    setTimeout(function () {

      window.location.href =
        'check-account.html'

    }, 300)
  }

  window.login =
    login

  /* ========================================
     РЕГИСТРАЦИЯ
  ======================================== */

  async function signup() {

  const name =
    nameInput.value.trim()

  const email =
    emailInput.value.trim()

  const password =
    passwordInput.value

  const confirmPassword =
    confirmPasswordInput.value.trim()


  /*
  Имя обязательно только при регистрации.
  При входе поле не проверяется.
  */

  if (!name) {

    statusText.textContent =
      'Введите имя или литературный псевдоним'

    nameInput.focus()

    return
  }


  if (!email) {

    statusText.textContent =
      'Введите Email'

    emailInput.focus()

    return
  }


  if (!password) {

    statusText.textContent =
      'Введите Password'

    passwordInput.focus()

    return
  }


  if (!confirmPassword) {

    statusText.textContent =
      'Заполните Confirm password'

    confirmPasswordInput.focus()

    return
  }


  if (password !== confirmPassword) {

    statusText.textContent =
      'Пароли не совпадают'

    confirmPasswordInput.focus()

    return
  }


  statusText.textContent =
    'Регистрация...'


  /*
  Имя сохраняется в metadata пользователя Supabase.

  После подтверждения почты check-account.html
  сможет получить его через:

  user.user_metadata.name
  */

  const { error } =
    await supabase.auth.signUp({

      email,
      password,

      options: {

        data: {
          name: name
        },

        emailRedirectTo:
          'https://matmodelator.github.io/Best100/confirm.html'

      }

    })


  if (error) {

    statusText.textContent =
      'Ошибка: ' + error.message

    return
  }


  statusText.textContent =
    'Письмо отправлено. Проверь почту.'


  setTimeout(function () {

    window.location.href =
      'check-email.html'

  }, 800)

}

window.signup =
  signup

</script>



<!-- ========================================
     SERVICE CONSOLE
======================================== -->

<div id="service-console">
стили | v1.1.1
</div>

<div class="row" id="build-down">
deploy: --
</div>

<script>
(function () {
  const now = new Date();

  const pad = n =>
    String(n).padStart(2, "0");

  const date =
      pad(now.getDate())
    + "."
    + pad(now.getMonth() + 1)
    + "."
    + now.getFullYear();

  const time =
      pad(now.getHours())
    + ":"
    + pad(now.getMinutes());

  document
    .getElementById("build-down")
    .textContent =
      "deploy: "
      + date
      + " "
      + time;
})();
</script>


</body>
</html>
