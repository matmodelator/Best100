<style>

/*
========================================
СТАТУСЫ ПОЛЬЗОВАТЕЛЯ
========================================
*/

.status-list {
  display: flex;
  flex-direction: column;

  gap: 10px;
}

.status {
  position: relative;

  padding: 8px 12px;

  background: #f4efe7;

  border-radius: 8px;

  cursor: help;
}

.status.active {
  background: #7c2d12;
  color: white;
}

/*
========================================
ПОДСКАЗКИ СТАТУСОВ
========================================
*/

.status::after {
  content: attr(data-tooltip);

  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);

  z-index: 1000;

  width: max-content;
  max-width: 260px;

  padding: 8px 10px;

  background: #1f2933;
  color: white;

  border-radius: 6px;

  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: normal;
  line-height: 1.35;

  text-align: left;
  white-space: normal;

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transform:
    translateX(-50%)
    translateY(4px);

  transition:
    opacity 0.15s ease,
    transform 0.15s ease,
    visibility 0.15s ease;
}

.status::before {
  content: "";

  position: absolute;
  left: 50%;
  bottom: calc(100% + 2px);

  z-index: 1001;

  border: 6px solid transparent;
  border-top-color: #1f2933;

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transform: translateX(-50%);

  transition:
    opacity 0.15s ease,
    visibility 0.15s ease;
}

.status:hover::after,
.status:hover::before,
.status:focus-visible::after,
.status:focus-visible::before {
  opacity: 1;
  visibility: visible;
}

.status:hover::after,
.status:focus-visible::after {
  transform:
    translateX(-50%)
    translateY(0);
}  

/*
========================================
КНОПКА ВХОД / РЕГИСТРАЦИЯ
========================================
*/

.user-actions {
  display: flex;
  flex-direction: column;

  gap: 10px;

  margin-top: auto;
  padding-top: 20px;
}

.auth-btn {
  width: 100%;

  padding: 14px;

  background: #7c2d12;
  color: white;

  border: 1px solid #7c2d12;
  border-radius: 8px;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;
}

.auth-btn:hover {
  filter: brightness(1.12);
}

</style>


<!-- ========================================
     СТАТУСЫ ПОЛЬЗОВАТЕЛЯ
======================================== -->

<div class="status-list">

  <div
    class="status active"
    data-status="Гость"
    data-tooltip="Посетитель без регистрации. Может читать и голосовать."
  >
    Гость
  </div>

  <div
    class="status"
    data-status="Читатель"
    data-tooltip="Авторизованный пользователь, который может оставлять комментарии."
  >
    Читатель
  </div>

  <div
    class="status"
    data-status="Критик"
    data-tooltip="Зарегистрированный пользователь, оставивший содержательный отзыв."
  >
    Критик
  </div>

  <div
    class="status"
    data-status="Эксперт"
    data-tooltip="Пользователь, получивший право расширенной оценки стихотворений."
  >
    Эксперт
  </div>

  <div
    class="status author-status"
    data-status="Автор"
    data-tooltip="Поэт, чьё стихотворение включено в Антологию XXI и одобрено редакцией."
  >
    Автор
  </div>

</div>


<!-- ========================================
     КНОПКА ПОЛЬЗОВАТЕЛЯ
======================================== -->

<div class="user-actions">

  <button
    id="headerAuthButton"
    class="auth-btn"
    type="button"
  >
    Вход / Регистрация
  </button>

</div>

<script>

/*
========================================
ТЕКУЩИЙ СТАТУС ПОЛЬЗОВАТЕЛЯ
========================================
*/

function getMenuUserStatus() {

  return (
    localStorage.getItem(
      "userStatus"
    )
    || "Гость"
  );

}
  
/*
========================================
UserID
========================================
*/
  
function getMenuUserId() {

  return localStorage.getItem(
    "userId"
  );

}
  
/*
========================================
ИМЯ ПОЛЬЗОВАТЕЛЯ
========================================
*/

function getMenuUserName() {

  return (
    localStorage.getItem(
      "userName"
    )
    || ""
  );

}


/*
========================================
ПОДСВЕТКА ТЕКУЩЕГО СТАТУСА
========================================
*/

function renderMenuUserStatus() {

  const currentStatus =
    getMenuUserStatus();

  document
    .querySelectorAll(
      "#menuContainer .status"
    )
    .forEach(function (statusElement) {

      statusElement.classList.toggle(
        "active",
        statusElement.dataset.status
          === currentStatus
      );

    });

}


/*
========================================
КНОПКА ПОЛЬЗОВАТЕЛЯ
========================================
*/

function renderMenuAuthButton() {

  const authButton =
    document.getElementById(
      "headerAuthButton"
    );

  if (!authButton) {
    return;
  }

  if (!getMenuUserId()) {

    authButton.textContent =
      "Вход / Регистрация";

    return;

  }

  authButton.innerHTML =
    "Hello, "
    + getMenuUserName()
    + "<br>Редактировать профиль";

}

/*
========================================
ПЕРЕХОД НА SIGN / PROFILE
========================================
*/

function initializeMenuAuthButton() {

  const authButton =
    document.getElementById(
      "headerAuthButton"
    );

  if (!authButton) {
    return;
  }

  authButton.addEventListener(
    "click",
    function () {

      const currentStatus =
        getMenuUserStatus();

      const isPoemPage =
        location.pathname.includes(
          "/21/poems/"
        );

      if (!getMenuUserId()) {

        window.location.href =
          isPoemPage
            ? "../../sign.html"
            : "sign.html";

      } else {

        window.location.href =
          isPoemPage
            ? "../../profile.html"
            : "profile.html";

      }

    }
  );

}


/*
========================================
ЗАПУСК МЕНЮ
========================================
*/

renderMenuUserStatus();
renderMenuAuthButton();
initializeMenuAuthButton();

</script>
