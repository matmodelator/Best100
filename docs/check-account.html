<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Проверка аккаунта</title>

<style>

/* ========================================
   ОБЩИЕ НАСТРОЙКИ
======================================== */

*{
    box-sizing:border-box;
}

html,
body{
    min-height:100%;
}

body{
    margin:0;

    font-family:Georgia,"Times New Roman",serif;

    background:#f4efe7;
    color:#1f1f1f;
}


/* ========================================
   ВЕРХНЯЯ КОРИЧНЕВАЯ ПЛАШКА
======================================== */

header{
    width:100%;

    padding:14px 20px;

    background:#7c2d12;
    color:#fff;

    text-align:center;

    box-shadow:0 2px 8px rgba(0,0,0,.16);
}

header h1{
    margin:0;

    font-size:28px;
    font-weight:normal;
    line-height:1.2;

    letter-spacing:.4px;
}


/* ========================================
   ОКНО ПРОВЕРКИ АККАУНТА
======================================== */

.container{
    width:360px;
    max-width:calc(100% - 24px);

    margin:32px auto;

    padding:24px 22px;

    background:#fffdf8;

    border:1px solid #d5c7b3;
    border-radius:12px;

    text-align:center;

    box-shadow:0 8px 22px rgba(64,42,27,.13);
}


/* ========================================
   ЗАГОЛОВОК ОКНА
======================================== */

h2{
    margin:0 0 18px;

    color:#5f2412;

    font-size:27px;
    font-weight:normal;
    line-height:1.25;
}


/* ========================================
   ИНДИКАТОР ЗАГРУЗКИ
======================================== */

.spinner{
    width:36px;
    height:36px;

    margin:20px auto;

    border:4px solid #dfd4c5;
    border-top-color:#7c2d12;
    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* ========================================
   БЛОК СТАТУСА И ДАННЫХ
======================================== */

#status{
    min-height:28px;

    margin-top:18px;

    color:#342820;

    font-family:Arial,sans-serif;
    font-size:15px;
    line-height:1.55;

    overflow-wrap:anywhere;
}

#status b{
    color:#5f2412;
}


/* ========================================
   КНОПКА ПЕРЕХОДА
======================================== */

#continueButton{
    display:inline-block;

    min-width:230px;

    margin-top:8px;
    padding:12px 24px;

    background:#7c2d12;
    color:#fff;

    border:1px solid #7c2d12;
    border-radius:8px;

    font-family:Georgia,"Times New Roman",serif;
    font-size:16px;
    font-weight:bold;
    line-height:1.2;

    cursor:pointer;

    box-shadow:0 3px 8px rgba(64,32,18,.16);

    transition:
        background .15s ease,
        border-color .15s ease,
        transform .15s ease,
        box-shadow .15s ease;
}

#continueButton:hover{
    background:#64200d;
    border-color:#64200d;

    box-shadow:0 5px 12px rgba(64,32,18,.2);
}

#continueButton:active{
    transform:translateY(1px);

    box-shadow:0 2px 5px rgba(64,32,18,.15);
}

#continueButton:focus-visible{
    outline:3px solid rgba(124,45,18,.22);
    outline-offset:3px;
}


/* ========================================
   СЕРВИСНАЯ КОНСОЛЬ
======================================== */

#service-console,
#build-down{
    position:fixed;
    bottom:7px;

    padding:4px 7px;

    color:rgba(55,40,30,.62);

    font-family:Arial,sans-serif;
    font-size:11px;
    line-height:1;

    pointer-events:none;
}

#service-console{
    left:7px;
}

#build-down{
    right:7px;
}


/* ========================================
   МОБИЛЬНАЯ ВЕРСИЯ
======================================== */

@media(max-width:560px){

    header{
        padding:12px 16px;
    }

    header h1{
        font-size:24px;
    }

    .container{
    width:calc(100% - 24px);
    max-width:360px;

    margin:20px auto 42px;

    padding:22px 18px;
}

    h2{
        font-size:24px;
    }

    #status{
        font-size:14px;
    }

    #continueButton{
        width:100%;
        min-width:0;

        padding:13px 18px;
    }

}

</style>
</head>

<body>

<header>

<h1>Рифмы века</h1>

</header>

<div class="container">

<h2>Проверка аккаунта</h2>

<div class="spinner"></div>

<div id="status">

Проверяем аккаунт...

</div>

</div>

<script type="module">

import { supabase }
from "./supabase-config.js";

const statusBox =
document.getElementById("status");

const spinner =
document.querySelector(".spinner");      

localStorage.removeItem("userId");
localStorage.removeItem("userName");
localStorage.removeItem("userStatus");
      
(async function(){

const {

data:{user},
error:userError

}=
await supabase.auth.getUser();

    
      
      console.log("USER =", user);
console.log("USER.ID =", user?.id);

statusBox.innerHTML =
"user.id = " + user?.id;
     
if(userError || !user){

spinner.style.display = "none";
      
statusBox.textContent=
"Пользователь не найден.";
     
setTimeout(function(){

location.href="sign.html";

},1000);

return;

}

localStorage.setItem(
  "userId",
  user.id
);

const {

data,
error

}=
await supabase
.from("top21_accounts")
.select("status, name")
.eq(
"user_id",
user.id
)
.single();

if(error){

statusBox.textContent=
"Создание аккаунта...";

const {

data:account,
error:insertError

}=
await supabase
.from("top21_accounts")
.insert({

user_id:user.id,

email:user.email,

name:
  user.user_metadata?.name
  || ""

})
.select("user_id,email,name,status")
.single();
      

if(insertError){

spinner.style.display = "none";

statusBox.textContent=
insertError.message;

return;

}

localStorage.setItem(
"userStatus",
account.status
);

localStorage.setItem(
"userName",
account.name || ""
);
      
spinner.style.display = "none";

statusBox.innerHTML = `
<b>user.id:</b><br>
${account.user_id}<br><br>

<b>email:</b><br>
${account.email}<br><br>

<b>name:</b><br>
${account.name || "(не задано)"}<br><br>

<b>status:</b><br>
${account.status}<br><br>

<button id="continueButton">
Авторизация успешна
</button>
`;

document
.getElementById("continueButton")
.onclick = function(){

  location.href = "index.html";

};

return;

}

localStorage.setItem(
"userStatus",
data.status
);

localStorage.setItem(
  "userName",
  data.name || ""
);
      
statusBox.innerHTML = `
<b>user.id:</b><br>
${user.id}<br><br>

<b>email:</b><br>
${user.email}<br><br>

<b>name:</b><br>
${data?.name || "(не задано)"}<br><br>

<b>status:</b><br>
${data?.status ?? "(не получен)"}
`;

spinner.style.display = "none";
      
statusBox.innerHTML += `
<br><br>
<button id="continueButton">
Авторизация успешна
</button>
`;

document
.getElementById("continueButton")
.onclick = function(){

  location.href = "index.html";

};

})();

</script>

<div id="service-console">
проверка аккаунта с новыми параметрами | v2.2.0
</div>

<div id="build-down">
deploy: --
</div>

<script>
(function(){

const now=new Date();

const pad=n=>String(n).padStart(2,"0");

document.getElementById(
"build-down"
).textContent=

"deploy: "
+pad(now.getDate())
+"."
+pad(now.getMonth()+1)
+"."
+now.getFullYear()
+" "
+pad(now.getHours())
+":"
+pad(now.getMinutes());

})();
</script>

</body>
</html>
