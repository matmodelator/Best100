<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Проверка аккаунта</title>

<style>

body{
    margin:0;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Georgia,"Times New Roman",serif;

    background:#f4efe7;
    color:#1f1f1f;
}

header{
    display:none;
}

.container{

    width:min(500px,92vw);

    margin:0;

    background:#fffdf8;

    border:1px solid #d8cbb5;
    border-radius:14px;

    padding:36px;

    text-align:center;

    box-shadow:0 10px 28px rgba(0,0,0,.12);
}

h2{

    margin:0 0 20px;

    font-size:30px;

    color:#5b4325;
}

#status{

    margin-top:20px;

    font-size:18px;

    line-height:1.7;
}

.spinner{

    width:38px;
    height:38px;

    margin:24px auto;

    border:4px solid #ddd;
    border-top-color:#8b6b46;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

#continueButton{

    margin-top:24px;

    padding:12px 28px;

    background:#8b6b46;
    color:#fff;

    border:none;
    border-radius:8px;

    font-size:17px;
    font-family:inherit;

    cursor:pointer;
}

#continueButton:hover{

    background:#735436;
}


@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

</style>

</head>

<body>

<header>

<h1>Рифмы века</h1>

</header>

<div class="container">

<h2>Проверка аккаунта</h2>

<div class="spinner"></div>

<div id="status">

Проверяем аккаунт...

</div>

</div>

<script type="module">

import { supabase }
from "./supabase-config.js";

const statusBox =
document.getElementById("status");

localStorage.removeItem("userId");
localStorage.removeItem("userName");
localStorage.removeItem("userStatus");
      
(async function(){

const {

data:{user},
error:userError

}=
await supabase.auth.getUser();

    
      
      console.log("USER =", user);
console.log("USER.ID =", user?.id);

statusBox.innerHTML =
"user.id = " + user?.id;


      
if(userError || !user){

statusBox.textContent=
"Пользователь не найден.";

setTimeout(function(){

location.href="sign.html";

},1000);

return;

}

localStorage.setItem(
  "userId",
  user.id
);

const {

data,
error

}=
await supabase
.from("top21_accounts")
.select("status, name")
.eq(
"user_id",
user.id
)
.single();

if(error){

statusBox.textContent=
"Создание аккаунта...";

const insert=
await supabase
.from("top21_accounts")
.insert({

user_id:user.id,

status:"Читатель",

name:
  user.user_metadata?.name
  || ""

});

if(insert.error){

statusBox.textContent=
insert.error.message;

return;

}

localStorage.setItem(
"userStatus",
"Читатель"
);

statusBox.innerHTML = `
<button id="continueButton">
Авторизация успешна
</button>
`;

document
.getElementById("continueButton")
.onclick = function(){

  location.href = "index.html";

};

return;

}

localStorage.setItem(
"userStatus",
data.status
);

localStorage.setItem(
  "userName",
  data.name || ""
);
      
statusBox.innerHTML = `
<b>user.id:</b><br>
${user.id}<br><br>

<b>email:</b><br>
${user.email}<br><br>

<b>status:</b><br>
${data?.status ?? "(не получен)"}
`;

statusBox.innerHTML += `
<br><br>
<button id="continueButton">
Авторизация успешна
</button>
`;

document
.getElementById("continueButton")
.onclick = function(){

  location.href = "index.html";

};

})();

</script>

<div id="service-console">
чек и лог new style & logic | v2.0.0
</div>

<div id="build-down">
deploy: --
</div>

<script>
(function(){

const now=new Date();

const pad=n=>String(n).padStart(2,"0");

document.getElementById(
"build-down"
).textContent=

"deploy: "
+pad(now.getDate())
+"."
+pad(now.getMonth()+1)
+"."
+now.getFullYear()
+" "
+pad(now.getHours())
+":"
+pad(now.getMinutes());

})();
</script>

</body>
</html>
