<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Добавить комментарий</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .comment-form {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    .comment-form h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    .poem-info {
      margin-bottom: 18px;
      padding: 10px 12px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #aaa;
      border-radius: 6px;
      background: #fff;
      color: #222;
      font: inherit;
    }

    .field textarea {
      min-height: 180px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    #cancelBtn {
      background: #ddd;
      color: #222;
    }

    #submitBtn {
      background: #222;
      color: #fff;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #status {
      min-height: 22px;
      margin-top: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.45;
    }

    #status.error {
      color: #a40000;
    }

    #status.success {
      color: #087a20;
    }

    #service-console {
      max-width: 700px;
      margin: 18px auto 0;
      color: #777;
      font-size: 12px;
    }

    #build-down {
      max-width: 700px;
      margin: 4px auto 0;
      color: #999;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .comment-form {
        padding: 16px;
      }

      .buttons {
        flex-direction: column-reverse;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <form
  class="comment-form"
  id="commentForm"
  onsubmit="return false;"
>

    <h1>Добавить комментарий</h1>

    <div class="poem-info">
      Стихотворение:
      <strong id="poemLabel">определяется...</strong>
    </div>

    <div class="field">
      <label for="authorName">
        Имя
      </label>

      <input
        id="authorName"
        name="authorName"
        type="text"
        maxlength="80"
        placeholder="Ваше имя"
        autocomplete="name"
        required
      >
    </div>

    <div class="field">
      <label for="commentText">
        Комментарий
      </label>

      <textarea
        id="commentText"
        name="commentText"
        maxlength="5000"
        placeholder="Напишите комментарий"
        required
      ></textarea>
    </div>

    <div class="buttons">
      <button
        id="cancelBtn"
        type="button"
      >
        Отмена
      </button>

      <button
        id="submitBtn"
        type="submit"
      >
        Отправить
      </button>
    </div>

    <div
      id="status"
      role="status"
      aria-live="polite"
    ></div>

  </form>

  <script type="module">
    import { supabase } from "./supabase-config.js";

    const form =
      document.getElementById("commentForm");

    const authorNameInput =
      document.getElementById("authorName");

    const commentTextInput =
      document.getElementById("commentText");

    const poemLabel =
      document.getElementById("poemLabel");

    const submitBtn =
      document.getElementById("submitBtn");

    const cancelBtn =
      document.getElementById("cancelBtn");

    const status =
      document.getElementById("status");

  /*
========================================
ОПРЕДЕЛЕНИЕ НОМЕРА СТИХОТВОРЕНИЯ

Номер передаётся в параметре:

comment.html?poem=

Если параметр отсутствует,
используется poemId = 0.
========================================
*/

const params =
  new URLSearchParams(
    window.location.search
  );

let poemId =
  Number(
    params.get("poem")
  );

if (!Number.isInteger(poemId) || poemId < 0) {
  poemId = 0;
}

poemLabel.textContent =
  poemId === 0
    ? "не указано"
    : "№" + poemId;

    /*
    ========================================
    СООБЩЕНИЕ ПОД ФОРМОЙ
    ========================================
    */

    function showStatus(message, type = "") {
      status.textContent = message;
      status.className = type;
    }

    /*
    ========================================
    БЛОКИРОВКА КНОПОК
    ========================================
    */

    function setSendingState(isSending) {
      submitBtn.disabled = isSending;
      cancelBtn.disabled = isSending;

      submitBtn.textContent =
        isSending
          ? "Отправка..."
          : "Отправить";
    }

    /*
    ========================================
    ОТПРАВКА КОММЕНТАРИЯ В SUPABASE
    ========================================
    */

    form.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();

        showStatus("");

        const authorName =
          authorNameInput.value.trim();

        const commentText =
          commentTextInput.value.trim();

        if (!authorName) {
          showStatus(
            "Введите имя.",
            "error"
          );

          authorNameInput.focus();

          return;
        }

        if (!commentText) {
          showStatus(
            "Введите комментарий.",
            "error"
          );

          commentTextInput.focus();

          return;
        }

        setSendingState(true);

        showStatus(
          "Отправка комментария..."
        );

        try {
          const { error } = await supabase
            .from("top21_comments")
            .insert([
              {
                poem_id: poemId,
                author_name: authorName,
                comment_text: commentText,
                is_approved: false
              }
            ]);

          /*
          Supabase возвращает ошибку объектом,
          поэтому её необходимо проверить отдельно.
          */

          if (error) {
            console.error(
              "Supabase insert error:",
              error
            );

            const errorDetails = [
              "Комментарий не отправлен.",
              "",
              "Сообщение: " +
                (error.message || "не указано"),
              "Код: " +
                (error.code || "не указан"),
              "Details: " +
                (error.details || "не указаны"),
              "Hint: " +
                (error.hint || "не указан")
            ].join("\n");

            showStatus(
              errorDetails,
              "error"
            );

            alert(errorDetails);

            return;
          }

          /*
          Ошибки нет — запрос принят Supabase.
          */

          form.reset();

          const successMessage =
            "Комментарий успешно отправлен на модерацию.";

          showStatus(
            successMessage,
            "success"
          );

          alert(successMessage);

        } catch (caughtError) {
          /*
          Сюда попадут ошибки импорта,
          сети или выполнения JavaScript.
          */

          console.error(
            "Comment submit exception:",
            caughtError
          );

          const errorMessage =
            "Комментарий не отправлен.\n\n" +
            (
              caughtError?.message ||
              String(caughtError)
            );

          showStatus(
            errorMessage,
            "error"
          );

          alert(errorMessage);

        } finally {
          setSendingState(false);
        }
      }
    );

    /*
    ========================================
    ОТМЕНА
    ========================================
    */

    cancelBtn.addEventListener(
      "click",
      function () {
        if (document.referrer) {
          history.back();
        } else {
          window.location.href =
            "./index.html";
        }
      }
    );
</script>
  


<!-- ========================================
     SERVICE CONSOLE
======================================== -->

<div id="service-console">
fix poemLabel & Get;| v1.3.7
</div>

<div class="row" id="build-down">
deploy: --
</div>

<script>
(function () {
  const now = new Date();

  const pad = n =>
    String(n).padStart(2, "0");

  const date =
      pad(now.getDate())
    + "."
    + pad(now.getMonth() + 1)
    + "."
    + now.getFullYear();

  const time =
      pad(now.getHours())
    + ":"
    + pad(now.getMinutes());

  document
    .getElementById("build-down")
    .textContent =
      "deploy: "
      + date
      + " "
      + time;
})();
</script>


</body>
</html>
